# Railway: the web service (root directory "web", config path "/web/railway.toml").
# Its one setting, API_URL, points at the API over Railway's private network.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["web/**"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
